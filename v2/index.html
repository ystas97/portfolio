<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Виктор Радюк — Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261021131308" />
</head>
<body>
  <div class="layout">
    <!-- Плашка слева: на десктопе закреплена (sticky), на мобиле — обычный блок сверху -->
    <aside class="side-card">
      <div class="side-card__blobs" aria-hidden="true"></div>
      <div class="side-card__top">
        <img class="side-card__avatar" src="../assets/avatar-victor.png" alt="Виктор Радюк" width="220" height="220" />
        <p class="side-card__text">Привет, меня зовут Виктор. Я&nbsp;— senior дизайнер, 6&nbsp;лет опыта в&nbsp;дизайне.</p>
        <p class="side-card__text">Специализируюсь на&nbsp;разработке мобильных приложений и&nbsp;веб-платформ.</p>
      </div>
      <nav class="side-card__actions" aria-label="Контакты">
        <a class="pill" href="resume.html">Резюме</a>
        <a class="pill" href="https://www.linkedin.com/in/viktor-radyuk/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="pill" href="https://t.me/allo_galochka" target="_blank" rel="noopener noreferrer">Tg</a>
      </nav>
    </aside>

    <!-- Проекты рисуются из projects.js -->
    <main class="projects" id="projects"></main>
  </div>
  <script src="projects.js?v=202610211301"></script>
  <script>
    document.getElementById("projects").innerHTML = PROJECTS.map((p) => `
      <a class="project" href="project.html?p=${p.slug}">
        <div class="project__media">
          <div class="project__tags">${p.tags.map((t) => `<span>${t}</span>`).join("")}</div>
          ${p.coverVideo
            ? `<video src="${asset(p.coverVideo)}" poster="${asset(p.cover)}" autoplay muted loop playsinline preload="metadata"></video>`
            : `<img src="${asset(p.cover)}" alt="${p.title}" loading="lazy" />`}
        </div>
        <h2 class="project__title">${p.title}</h2>
        <p class="project__lead">${p.lead}</p>
      </a>`).join("");
  </script>
</body>
</html>
