<body>
  <div class="layout layout--project">
    <aside class="side-card">
      <div class="side-card__blobs" aria-hidden="true"></div>
      <div class="side-card__top">
        <img class="side-card__avatar" src="../assets/avatar-victor.png" alt="Виктор Радюк" width="220" height="220" />
        <p class="side-card__text">Привет, меня зовут Виктор. Я&nbsp;— senior дизайнер, 6&nbsp;лет опыта в&nbsp;дизайне.</p>
        <p class="side-card__text">Специализируюсь на&nbsp;разработке мобильных приложений и&nbsp;веб-платформ.</p>
      </div>
      <nav class="side-card__actions" aria-label="Контакты">
        <a class="pill" href="./">Портфолио</a>
        <a class="pill" href="resume.html">Резюме</a>
        <a class="pill" href="https://t.me/allo_galochka" target="_blank" rel="noopener noreferrer">Tg</a>
      </nav>
    </aside>

    <!-- Мокап айфона с кликабельным прототипом (экраны и зоны клика — в projects.js) -->
    <div class="phone-col">
      <div class="phone">
        <div class="phone__screen" id="phone-screen">
          <div class="phone__slides" id="phone-slides"></div>
          <div class="phone__status" aria-hidden="true">
            <span>9:41</span>
            <span class="phone__island"></span>
            <span class="phone__icons">
              <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
              <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.8a6.8 6.8 0 0 0-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c.5 0 1 .2 1.3.5L8 10.6 6.7 9.3c.3-.3.8-.5 1.3-.5Z"/></svg>
              <span class="phone__battery"></span>
            </span>
          </div>
          <span class="phone__home" aria-hidden="true"></span>
        </div>
      </div>
      <div class="phone-col__bar">
        <span>Прототип — нажимай на кнопки</span>
        <button class="phone-col__restart" id="phone-restart" type="button">↺ Сначала</button>
      </div>
    </div>

    <main class="info">
      <header class="info__head">
        <h1 class="info__title" id="info-title"></h1>
        <a class="pill pill--sm info__close" href="./">Закрыть</a>
      </header>
      <nav class="info__nav" id="info-nav" aria-label="Другие проекты"></nav>
      <section class="info__about">
        <h2 class="info__label">О проекте</h2>
        <div class="info__text" id="info-text"></div>
      </section>
      <div class="info__gallery" id="info-gallery"></div>
    </main>
  </div>

  <script src="projects.js?v=202610211301"></script>
  <script src="project.js?v=202610211301"></script>
