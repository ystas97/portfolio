  <script src="projects.js?v=202610211301"></script>
  <script>
    document.getElementById("projects").innerHTML = PROJECTS.map((p) => `
      <a class="project" href="project.html?p=${p.slug}">
        <div class="project__media">
          <div class="project__tags">${p.tags.map((t) => `<span>${t}</span>`).join("")}</div>
          ${p.coverVideo
            ? `<video src="${asset(p.coverVideo)}" poster="${asset(p.cover)}" autoplay muted loop playsinline preload="metadata"></video>`
            : `<img src="${asset(p.cover)}" alt="${p.title}" loading="lazy" />`}
        </div>
        <h2 class="project__title">${p.title}</h2>
        <p class="project__lead">${p.lead}</p>
      </a>`).join("");
